name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m targetgate suite
      - run: python -m targetgate run fixture
      # The corrupted snapshot must be refused AND deliver nothing.
      - run: "! python -m targetgate run corrupted"
      - run: python -m targetgate brief
      # A hallucinating analyst must be refused by the grounding gate.
      - run: "! python -m targetgate brief hallucinating"
