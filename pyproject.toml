[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "targetgate"
version = "0.1.0"
description = "Twice-monthly provider-targeting pipeline; no list reaches sales until it passes the gate"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest"]
obs = ["braintrust"]
azure = ["azure-functions", "azure-storage-blob"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
